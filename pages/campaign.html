  /* ── Creating a selection list: straight into the shared send sheet
     with this campaign locked as the destination, the same sheet the
     influencers page uses. It opens with nobody on it and the AI box
     offering to build the list for the open slots — the user's call to
     press — or people are added from the influencer list there. A band
     narrows the ask to that one slot; otherwise the ask is whatever is
     still open. */
  function startSend(band, anchor){
    setTab('selection');
    openSendSheet([], anchor, band);
  }
  function openSendSheet(ids, anchor, band){
    window.sendSheet.open({
      anchor: anchor || null, band: band || null,
      infIds: ids, people: byInf, campaigns: S.merged(), defaultCampaignId: c.id, lockCampaign: true,
      onSend: function(r){
        /* Sending against an edited ask updates the campaign's own ask, so
           the next batch inherits the corrected figure. Compared as slots,
           not objects: the merge rebuilds the map in a different key order. */
        if (Object.keys(r.ask).length) {
          var cur = S.get(c.id), merged = M.mergeAsk(cur, r.ask);
          if (!M.sameAsk(merged, cur.requirement)) S.setRequirement(c.id, merged);
        }
        var n = S.addBatch(c.id, {name: r.name, infIds: r.infIds, ask: r.ask, recipient: r.recipient, expiresAt: r.expiresAt, requireName: r.requireName});
        openBatches = {}; openBatches[n] = true;
        renderAll();
        var sent = r.infIds.length;
        toast('Selection list created — batch ' + n + ', ' + sent + (sent === 1 ? ' creator' : ' creators') + '. Copy the client link from its card.');
      }
    });
  }

  /* ── The campaigns rail. Every campaign as a compact card, the current
     one outlined; C toggles it, [ and ] step to the neighbours. The
     state is kept, so a rail left open is open on the next campaign. */
  var RAIL_KEY = 'collab-campaign-rail';
  function railOpen(){ return E('cdRail').classList.contains('is-on'); }
  function railCard(x, i){
    var st = S.stageOf(x.stage) || {};
    var want = 0, filled = 0;
    M.groupsOf(x, byInf).forEach(function(g){ want += g.want; g.fills.forEach(function(r){ if (r.state === 'confirmed') filled += 1; }); });
    var cur = x.id === c.id;
    return '<a class="cd-rcard' + (cur ? ' is-current' : '') + '" href="campaign.html?id=' + encodeURIComponent(x.id) + '" data-rail="' + esc(x.id) + '" style="--i:' + i + '"' + (cur ? ' aria-current="page"' : '') + '>' +
      '<span class="cd-rtop"><span class="cd-rlogo" data-rail-logo="' + esc(x.brand || '') + '">' + esc(S.initials(x.brand || x.name)) + '<img alt="" hidden /></span>' +
        '<span class="cd-rtxt"><span class="n">' + esc(x.name) + '</span><span class="s"><span class="cmp-dot" style="background:' + (st.dot || 'var(--color-neutral-4)') + '"></span>' + esc(st.label || x.stage) + (x.brand ? ' · ' + esc(x.brand) : '') + '</span></span></span>' +
      '<span class="cd-rfoot"><span>' + (want ? '<b>' + filled + '</b> / ' + want + ' slots' : '<span class="dash">No ask yet</span>') + '</span><span>' + esc(S.fmtRange(x.start, x.end) || '') + '</span></span></a>';
  }
  function renderRail(){
    var track = E('cdRailTrack');
    track.innerHTML = S.merged().map(railCard).join('');
    if (window.collabBrand) track.querySelectorAll('[data-rail-logo]').forEach(function(el){
      var img = el.querySelector('img'), brand = el.dataset.railLogo; if (!brand) return;
      window.collabBrand.attach(img, brand, function(ok){ img.hidden = !ok; });
    });
  }
  function setRail(on, silent){
    var rail = E('cdRail');
    if (on) renderRail();
    rail.classList.toggle('is-on', on);
    if (on) rail.removeAttribute('inert'); else rail.setAttribute('inert', '');
    E('cdRailBtn').setAttribute('aria-pressed', String(on));
    try { localStorage.setItem(RAIL_KEY, on ? '1' : '0'); } catch (e) {}
    if (on) {
      var cur = E('cdRailTrack').querySelector('.is-current');
      if (cur) setTimeout(function(){ cur.scrollIntoView({inline: 'center', block: 'nearest', behavior: silent || REDUCED ? 'auto' : 'smooth'}); }, silent ? 0 : 120);
    }
  }
  /* Leaving for another campaign: hand the hero's and header's names to
     the card being opened, so it is the card that grows into the next
     page, and not two things claiming the same name. */
  function goCampaign(id, fromEl){
    document.querySelector('.cd-hero').style.viewTransitionName = 'none';
    document.querySelector('.cd-headrow').style.viewTransitionName = 'none';
    if (fromEl) {
      fromEl.style.viewTransitionName = 'campaign-card';
      var top = fromEl.querySelector('.cd-rtop'); if (top) top.style.viewTransitionName = 'campaign-head';
    }
    location.href = 'campaign.html?id=' + encodeURIComponent(id);
  }
  E('cdRailBtn').addEventListener('click', function(){ setRail(!railOpen()); });
  E('cdRailTrack').addEventListener('click', function(e){
    var a = e.target.closest('[data-rail]'); if (!a) return;
    e.preventDefault();
    if (a.dataset.rail === c.id) return;
    goCampaign(a.dataset.rail, a);
  });
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey || !c) return;
    var t = e.target;
    if (t && t.matches && t.matches('input, textarea, select, [contenteditable="true"]')) return;
    if (window.swingModal && window.swingModal.isOpen()) return;
    if (e.key === 'c' || e.key === 'C') { e.preventDefault(); setRail(!railOpen()); return; }
    if (e.key === '[' || e.key === ']') {
      var list = S.merged(), i = -1;
      list.forEach(function(x, k){ if (x.id === c.id) i = k; });
      var j = e.key === '[' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= list.length) return;
      e.preventDefault();
      goCampaign(list[j].id, E('cdRailTrack').querySelector('[data-rail="' + list[j].id + '"]'));
    }
  });

  /* ── Add by hand happens on the influencers page, with its full
     search and filters; it comes back here with what was ticked. The
     band, if any, rides along so the fill lands in that slot. */
  function goAddByHand(band){
    location.href = 'influencers-v2.html?for=' + encodeURIComponent(c.id) + (band ? '&band=' + encodeURIComponent(band) : '');
  }

  /* ── Header actions. */
  E('cdEdit').addEventListener('click', function(){
    campaignForm.open({rec: c, anchor: E('cdEdit'), onSave: saveEdit});
  });
  E('cdShare').addEventListener('click', function(){ startSend(null, E('cdShare')); });
  E('cdDelete').addEventListener('click', function(){
    window.swingModal.confirm({
      anchor: E('cdDelete'), title: 'Delete campaign?', danger: true, ok: '<i class="ph ph-trash"></i> Delete',
      body: 'This removes <strong>' + esc(c.name) + '</strong> and its roster and preview batches from the workspace. The seeded sample data on disk is untouched.',
      onOk: function(){ S.remove(c.id); location.href = 'campaigns.html'; }
    });
  });

  /* ── Boot: bones first, the campaign a beat later with the arrival
     cascade. The data is inline, so the beat is staged rather than real
     — the same 1000ms the roster and list pages hold. */
  function skeleton(){
    if (!c) return;
    E('cdName').innerHTML = '<span class="cd-sk" style="width:min(360px, 60vw); height:28px"></span>';
    E('cdStageWrap').innerHTML = '<span class="cd-sk pill" style="width:120px"></span>';
    E('cdSub').innerHTML = '<span class="cd-sk" style="width:min(420px, 70%); height:12px"></span>';
    E('cdBrandMark').hidden = true;
    E('cdKpis').innerHTML = [0,1,2,3].map(function(){
      return '<span class="cd-kpi" style="pointer-events:none"><span class="cd-sk" style="width:56px; height:9px"></span><span class="cd-sk" style="width:64px; height:22px"></span><span class="cd-sk" style="width:80%; height:9px"></span></span>';
    }).join('');
    E('cdNext').classList.remove('is-quiet');
    E('cdNextBody').innerHTML = '<span class="cd-sk" style="width:56px; height:10px"></span><span class="say"><span class="cd-sk" style="width:90%; height:14px; margin-bottom:8px"></span><span class="cd-sk" style="width:60%; height:14px"></span></span><span class="acts"><span class="cd-sk pill" style="width:150px; height:40px"></span></span>';
    E('cdTimeline').hidden = true;
    E('pan-overview').innerHTML = '<div class="cd-ov">' + ['span-4', 'span-2', 'span-2', 'span-2', 'span-2'].map(function(sp){
      return '<div class="cd-card ' + sp + '"><div class="cd-card-h"><span class="cd-chip gray"></span><span class="cd-sk" style="width:96px"></span></div>' +
        '<span class="cd-sk" style="width:80%; height:12px"></span><span class="cd-sk" style="width:55%; height:12px"></span><span class="cd-sk" style="width:65%; height:12px"></span></div>';
    }).join('') + '</div>';
  }
  if (!c) { missing(); }
  else {
    skeleton();
    setTab(tab);
    setTimeout(function(){
      /* A hidden document never advances CSS animations, so the cascade
         would hold everything at its first, invisible frame. Skip it. */
      if (!document.hidden) E('cdContent').classList.add('cd-arriving');
      renderAll();
      var railWas = false; try { railWas = localStorage.getItem(RAIL_KEY) === '1'; } catch (e) {}
      if (railWas) setRail(true, true);
      setTimeout(function(){ E('cdContent').classList.remove('cd-arriving'); }, 900);
      if (addedByHand) {
        toast(addedByHand + (addedByHand === 1 ? ' creator' : ' creators') + ' added by hand.');
        var au = new URL(location.href); au.searchParams.delete('added'); history.replaceState(null, '', au);
      }
    }, REDUCED ? 0 : 1000);
  }
})();
</script>
</body>
</html>
